name: taskops-capstone

services:
  app:
    build:
      context: .
      args:
        APP_VERSION: "${APP_VERSION:-0.1.0}"
        GIT_COMMIT_SHA: "${GIT_COMMIT_SHA:-}"
        BUILD_DATE: "${BUILD_DATE:-}"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-taskops}"
      DB_HOST: "${DB_HOST:-db}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_USER: "${DB_USER:-taskops}"
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
      DB_SSLMODE: "${DB_SSLMODE:-prefer}"
      APP_TRUSTED_HOSTS: "${APP_TRUSTED_HOSTS:-localhost,127.0.0.1,[::1],app}"
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      SEED_DEMO: "${SEED_DEMO:-0}"
    ports:
      - "127.0.0.1:${APP_PORT:-8090}:8090"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8090/health/ready', timeout=5).close()"]
      interval: 10s
      timeout: 6s
      start_period: 15s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 20s
    networks: [frontend, database]

  db:
    image: postgres:17.12-bookworm
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-taskops}"
      POSTGRES_USER: "${POSTGRES_ADMIN_USER:-taskops_admin}"
      POSTGRES_PASSWORD: "${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}"
      DB_USER: "${DB_USER:-taskops}"
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD in .env}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/01-bootstrap.sql:/docker-entrypoint-initdb.d/01-bootstrap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 10
    networks: [database]

volumes:
  postgres_data:

networks:
  frontend:
  database:
    internal: true
